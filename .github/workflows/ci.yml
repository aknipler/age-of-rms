name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      # Before Typecheck, because the generated type is what Typecheck reads: a
      # stale one typechecks perfectly and lies about the schema.
      - name: Check generated types
        run: npm run check:generated-types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate reference data
        run: npm run validate:reference
